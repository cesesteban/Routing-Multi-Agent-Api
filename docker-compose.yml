services:
  multi-agent-routing-api:
    build: .
    container_name: multi_agent_routing_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - persistent_data:/app/persistent
      # Monta las credenciales ADC del host dentro del contenedor (read-only)
      - C:\Users\c-est\AppData\Roaming\gcloud\application_default_credentials.json:/root/.config/gcloud/application_default_credentials.json:ro
    env_file:
      - .env
    environment:
      # Override: el path en .env apunta al host; este apunta al path DENTRO del contenedor
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      # Database siempre usa el path interno del contenedor
      - DATABASE_URL=sqlite+aiosqlite:////app/persistent/multi_agent_system.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  persistent_data:
